<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Art Studio · Stickman Studio</title><link rel="stylesheet" href="creative.css?v=20260910b"></head><body><header><strong>Stickman Creative Studio</strong><nav><a href="index.html" >Animation</a><a href="portraits.html" >Portraits</a><a href="canvas.html" >Infinite Canvas</a><a href="art.html" aria-current="page">Art Studio</a></nav></header><main><div class="heading"><div><h1>Art Studio</h1><p>Draw, layer images and text, then set your artwork in motion.</p></div></div><div class="workspace"><aside class="panel"><label>Tool<select id="tool"><option value="select">Select / move</option><option value="pen">Pen</option><option value="rectangle">Rectangle</option><option value="ellipse">Ellipse</option><option value="note">Text / note</option></select></label><label>Colour<input id="colour" type="color" value="#5b46d9"></label><label>Brush / line width<input id="brush" type="range" min="1" max="32" value="5"></label><label class="full">Text<textarea id="noteText" placeholder="Write a note or caption…">Your idea here</textarea></label><button id="applyText" class="secondary">Update selected text</button><label>Upload image<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="row full"><button id="undo" class="secondary">Undo</button><button id="redo" class="secondary">Redo</button></div><div class="row full"><button id="smaller" class="secondary">Smaller</button><button id="larger" class="secondary">Larger</button></div><button id="front" class="secondary">Bring to front</button><button id="delete" class="secondary">Delete selected</button><button id="saveProject" class="secondary">Save project</button><label>Open project<input id="openProject" type="file" accept=".json,application/json"></label><label>Canvas background<input id="background" type="color" value="#e4efff"></label><label>Animation<select id="motion"><option value="float">Float</option><option value="sway">Sway</option><option value="zoom">Slow zoom</option><option value="reveal">Draw-on reveal</option><option value="none">Still</option></select></label><label>Duration<select id="duration"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="15">15 seconds</option></select></label><button id="animate">Preview animation</button><button id="exportArt">Export animation</button><h2 class="full">Layers</h2><div id="layers" class="layers full"></div><p class="hint full">Draw with Pen or shapes, add text, or upload a picture. Select items to move them. Exports animate the complete artwork.</p></aside><section class="surface "><canvas id="boardCanvas" width="960" height="640" aria-label="Art canvas" tabindex="0"></canvas><div class="export-row"><button id="saveImage">Save PNG</button><button id="sendScene" class="secondary">Use in animation</button></div><button id="cancel" hidden>Cancel export</button><progress id="progress" max="100" value="0" hidden></progress><p id="status" class="status" role="status" aria-live="polite"></p><a id="download" class="button" hidden></a></section></div></main><script src="js/webmWriter.js?v=20260819c"></script><script src="js/creative-core.js?v=20260910b"></script><script src="js/board.js?v=20260910b"></script></body></html>
